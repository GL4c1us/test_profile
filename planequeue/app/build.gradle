plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gl4c1us.planequeue'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gl4c1us.planequeue'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
