name: Build Plane Queue APK

# v1.4 direct branch build trigger
on:
  push:
    branches: [chatgpt-plane-queue-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: planequeue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk PlaneQueue.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlaneQueue-APK
          path: planequeue/PlaneQueue.apk
          if-no-files-found: error
