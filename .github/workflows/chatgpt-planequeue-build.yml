name: ChatGPT Plane Queue APK

# Plane Queue v1.3 rebuild trigger
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/chatgpt-planequeue-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Plane Queue branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-plane-queue-apk
          path: src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src/planequeue
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp src/planequeue/app/build/outputs/apk/debug/app-debug.apk PlaneQueue.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlaneQueue-APK
          path: PlaneQueue.apk
          if-no-files-found: error
