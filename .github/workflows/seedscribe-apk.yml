name: SeedScribe Android APK
on:
  push:
    branches: [ "seedscribe-apk-build-20261026" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4
      - name: Unpack SeedScribe source
        run: unzip -q seedscribe-source.zip
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android SDK API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: SeedScribe-Android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeedScribe-debug-APK
          path: SeedScribe-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
