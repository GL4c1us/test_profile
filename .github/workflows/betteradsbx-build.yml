name: Better ADSBx Build

on:
  push:
    branches:
      - betteradsbx-build-temp
    paths:
      - 'betteradsbx/**'
      - '.github/workflows/betteradsbx-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: betteradsbx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: betteradsbx-release
          path: betteradsbx/app/build/outputs/apk/release/app-release-unsigned.apk
